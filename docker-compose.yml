version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ethiosugar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ethio_sugar_db_user
      POSTGRES_PASSWORD: ethio_sugar_password
      POSTGRES_DB: ethio_sugar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethio_sugar_db_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n
    container_name: ethiosugar-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=KhalidGirma
      - N8N_BASIC_AUTH_PASSWORD=54321Qazxsw.
      - N8N_BASIC_AUTH_EMAIL=admin@ethiosugar.local
      - WEBHOOK_URL=http://localhost:5678
      - N8N_HOST=localhost
      - N8N_PORT=5678
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
